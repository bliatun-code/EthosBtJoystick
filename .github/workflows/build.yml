name: Build

# Builds the driver and the app and runs the tests for every change.
# Pushing a version tag (v1.2.3) additionally creates a *draft* release with
# the packaged zip and the installer attached; review it on GitHub and publish
# it by hand.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7

      - name: Check that the tag matches the version in Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        run: |
          $version = (Select-String -Path app/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME does not match version $version in app/Cargo.toml"
          }

      - name: Cache the WDK package
        uses: actions/cache@v6
        with:
          path: tools/wdk-nuget/wdk.nupkg
          key: wdk-nuget-${{ hashFiles('tools/get-wdk.ps1') }}

      - name: Fetch the WDK (headers, libraries and Inf2Cat for the driver)
        shell: powershell
        run: ./tools/get-wdk.ps1

      - name: Cache the Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: Build the driver and the app, run the tests
        shell: powershell
        run: ./build.ps1 -Test

      # The build image has Inno Setup 6 preinstalled; fetch it only if that changes.
      - name: Fetch Inno Setup if the build image does not have it
        shell: powershell
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { ./tools/get-innosetup.ps1 }

      - name: Package the release zip and the installer
        shell: powershell
        run: ./tools/package-release.ps1

      - name: Upload the zip and the installer
        uses: actions/upload-artifact@v7
        with:
          name: EthosBtJoystick-win-x64
          path: |
            dist/EthosBtJoystick-*.zip
            dist/EthosBtJoystick-*-setup.exe
          if-no-files-found: error

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: EthosBtJoystick-win-x64

      - name: Create a draft release with the zip and the installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum EthosBtJoystick-*.zip EthosBtJoystick-*-setup.exe
          gh release create "$GITHUB_REF_NAME" EthosBtJoystick-*.zip EthosBtJoystick-*-setup.exe \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --generate-notes \
            --title "Ethos BT Joystick ${GITHUB_REF_NAME#v}"
